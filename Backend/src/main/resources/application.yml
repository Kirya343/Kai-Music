server:
  port: 8080
  tomcat:
    max-http-form-post-data-size: 100MB
    max-swallow-size: -1 
    max-part-count: 1000
    max-http-form-post-size: 20971520  # 20MB

logging:
  pattern:
    console: "%d{HH:mm:ss yyyy-MM-dd} [%thread] %-5level %logger{36} - %msg%n"

spring:
  profiles:
    active: 
      - "production"
      
  web:
    resources:
      static-locations: classpath:/static/,classpath:/images/

  mvc:
    static-path-pattern: /**

  servlet:
    multipart:
      enabled: true        
      max-file-size: 20MB   
      max-request-size: 100MB   
      file-size-threshold: 2MB   

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate: 
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
      connection:
        isolationLevel: 2
    show-sql: false

  lifecycle:
    timeout-per-shutdown-phase: "20s"

  config:
    import:
      - classpath:config/database.yml
      - classpath:config/main.yml
      - classpath:config/logging.yml
      - classpath:config/cors.yml
      - classpath:config/s3.yml
      - optional:file:./config/cors.yml
      - optional:file:./config/database.yml
      - optional:file:./config/main.yml
      - optional:file:./config/logging.yml
      - optional:file:./config/s3.yml