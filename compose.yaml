services:

    nginx:
        image: nginx:alpine
        container_name: kai-nginx
        restart: unless-stopped
        ports:
            - "127.0.0.1:18081:80"
        volumes:
            - ./Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./Nginx/conf.d:/etc/nginx/conf.d:ro
        networks:
            - proxy-network

    backend-db:
        image: mariadb:11.4
        container_name: kai-backend-db
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${BACKEND_DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${BACKEND_DB_NAME}
            MARIADB_USER: ${BACKEND_DB_USER}
            MARIADB_PASSWORD: ${BACKEND_DB_PASSWORD}
        volumes:
            - backend_db_data:/var/lib/mysql
            - ./Database/backend_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
        networks:
            - backend-network
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10

    bot-db:
        image: mariadb:11.4
        container_name: kai-bot-db
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: ${BOT_DB_ROOT_PASSWORD}
            MARIADB_DATABASE: ${BOT_DB_NAME}
            MARIADB_USER: ${BOT_DB_USER}
            MARIADB_PASSWORD: ${BOT_DB_PASSWORD}
        volumes:
            - bot_db_data:/var/lib/mysql
        networks:
            - bot-network
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10

    backend:
        container_name: kai-backend
        build:
            context: ./Backend
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            DATABASE_URL: jdbc:mariadb://backend-db:3306/${BACKEND_DB_NAME}
            DATABASE_USER: ${BACKEND_DB_USER}
            DATABASE_PASSWORD: ${BACKEND_DB_PASSWORD}

            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_BUCKET: ${S3_BUCKET}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}

            FRONTEND_URL: ${FRONTEND_URL}

            ACRCLOUD_HOST: ${ACRCLOUD_HOST}
            ACRCLOUD_ACCESS_KEY: ${ACRCLOUD_ACCESS_KEY}
            ACRCLOUD_ACCESS_SECRET: ${ACRCLOUD_ACCESS_SECRET}
            
            APP_DOMAIN: ${APP_DOMAIN}
        depends_on:
            backend-db:
                condition: service_healthy

        stdin_open: true
        tty: true

        volumes:
            - /opt/kai/ssl:/app/ssl:ro

        networks:
            - backend-network
            - proxy-network

    telegram-bot:
        container_name: kai-telegram-bot
        build:
            context: ./TelegramBot
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            DATABASE_URL: jdbc:mariadb://bot-db:3306/${BOT_DB_NAME}
            DATABASE_USER: ${BOT_DB_USER}
            DATABASE_PASSWORD: ${BOT_DB_PASSWORD}
        depends_on:
            bot-db:
                condition: service_healthy
        networks:
            - bot-network
            - backend-network

    frontend:
        container_name: kai-frontend
        build:
            context: ./Frontend
            dockerfile: Dockerfile
        restart: unless-stopped
        networks:
            - backend-network
            - proxy-network

networks:
    backend-network:
        driver: bridge

    bot-network:
        driver: bridge

    proxy-network:
        driver: bridge

volumes:
    backend_db_data:
    bot_db_data: